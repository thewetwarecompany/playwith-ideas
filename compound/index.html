<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Curve Turns Late</title>
<style>
  body { margin:0; background:#f7f6f2; color:#1f1f1f; font: 16px/1.5 Georgia, serif; }
  main { width:min(880px, calc(100% - 28px)); margin:0 auto; padding:28px 0 48px; }
  h1 { font-weight:400; font-size:clamp(32px,6vw,52px); letter-spacing:-.03em; }
  svg { width:100%; height:auto; background:#fff; border:1px solid #c9c7c1; }
  label { display:grid; grid-template-columns:1fr auto; font:13px/1.3 ui-sans-serif, system-ui, sans-serif; margin:10px 0; }
  #out { font-size:22px; }
  a { color:inherit; }
</style>
</head>
<body>
<main>
  <p><a href="../index.html">Playwith.ideas</a></p>
  <h1>The Curve Turns Late</h1>
  <p>Something doubles on a schedule. For a long time it looks like nothing. Then it is the whole page.</p>
  <svg id="plot" viewBox="0 0 640 280" role="img" aria-label="Growth curve"></svg>
  <p id="out" aria-live="polite"></p>
  <label>Starting amount <output id="oStart">1</output><input id="start" type="range" min="1" max="20" value="1"></label>
  <label>Doubles every <output id="oDays">7</output> days <input id="days" type="range" min="1" max="30" value="7"></label>
  <label>How far you look <output id="oSpan">90</output> days <input id="span" type="range" min="14" max="180" value="90"></label>
  <p>The surprise is not the formula. It is how little of the climb happens in the first half of the time.</p>
  <noscript><p>With scripts off: one unit, doubling every week, is still only 64 after six weeks and 8,192 after thirteen.</p></noscript>
</main>
<script>
(function () {
  var start = document.getElementById("start"), days = document.getElementById("days"), span = document.getElementById("span");
  function draw() {
    var s = +start.value, d = +days.value, n = +span.value;
    document.getElementById("oStart").textContent = s;
    document.getElementById("oDays").textContent = d;
    document.getElementById("oSpan").textContent = n;
    var pts = [], half = 0, end = 0;
    for (var t = 0; t <= n; t++) {
      var v = s * Math.pow(2, t / d);
      pts.push(v);
      if (t === Math.floor(n / 2)) half = v;
      if (t === n) end = v;
    }
    var max = end || 1;
    var path = pts.map(function (v, i) {
      var x = 20 + (600 * i / n);
      var y = 250 - (220 * v / max);
      return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }).join(" ");
    document.getElementById("plot").innerHTML = '<line x1="20" y1="250" x2="620" y2="250" stroke="#c9c7c1"/><path d="' + path + '" fill="none" stroke="#1f1f1f" stroke-width="2"/>';
    document.getElementById("out").textContent = "Halfway through the time, you have " + half.toFixed(1) + ". At the end you have " + end.toFixed(1) + ". Most of it arrives after you have already been watching.";
  }
  [start, days, span].forEach(function (el) { el.addEventListener("input", draw); });
  draw();
})();
</script>
</body>
</html>
